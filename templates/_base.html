<!-- templates/_base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Deng | {% block page_title %}Welcome{% endblock page_title %}</title>

    <!-- Fonts (from Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* ---------- Colors & shared values ---------- */
        :root {
            --coffee: #6f4e37;
            --coffee-dark: #2b1d14;
            --cream: #f8f1e7;
            --latte: #c08552;
            --white: #ffffff;
            --radius: 14px;
            --shadow: 0 8px 24px rgba(43, 29, 20, 0.08);
        }

        /* ---------- Base ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--cream);
            color: var(--coffee-dark);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1100px, 92%);
            margin-inline: auto;
        }

        /* ---------- Header ---------- */
        .site-header {
            background: var(--coffee-dark);
            color: var(--cream);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 0;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .nav {
            display: flex;
            gap: 24px;
        }

        .nav a {
            opacity: 0.85;
            transition: color 0.2s, opacity 0.2s;
        }

        .nav a:hover {
            opacity: 1;
            color: var(--latte);
        }

        /* ---------- Page hero ---------- */
        .page-hero {
            background: linear-gradient(135deg, var(--coffee), var(--coffee-dark));
            color: var(--cream);
            text-align: center;
            padding: 72px 0;
        }

        .page-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
        }

        .page-hero p {
            opacity: 0.85;
            margin-top: 8px;
            font-size: 1.1rem;
        }

        /* ---------- Content ---------- */
        .content {
            padding: 56px 0;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 28px;
        }
        .mt-section {
            margin-top: 48px;
        }

        .grid {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card h3 {
            color: var(--coffee);
            margin-bottom: 8px;
        }

        .icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .info {
            text-align: center;
            margin-top: 40px;
        }

        .btn {
            display: inline-block;
            background: var(--latte);
            color: var(--white);
            padding: 12px 28px;
            border-radius: 999px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--coffee);
        }

        /* ---------- Footer ---------- */
        .site-footer {
            background: var(--coffee-dark);
            color: var(--cream);
            text-align: center;
            padding: 24px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="{% url 'pages:home' %}">☕ Cafe Deng</a>
            <nav class="nav">
                <a href="{% url 'pages:home' %}">Home</a>
                <a href="{% url 'pages:about' %}">About</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-hero">
            <div class="container">
                <h1>{% block page_h1 %}{% endblock page_h1 %}</h1>
                <p>{% block page_subtitle %}{% endblock page_subtitle %}</p>
            </div>
        </section>

        <section class="content">
            <div class="container">
                {% block content %}
                {% endblock content %}
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Cafe Deng &middot; Built with Django</p>
        </div>
    </footer>
</body>
</html>
