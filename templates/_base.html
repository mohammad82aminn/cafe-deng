{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Deng | {% block page_title %}Welcome{% endblock page_title %}</title>

    <!-- Fonts (from Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Site styles -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="{% url 'pages:home' %}">☕ Cafe Deng</a>
            <nav class="nav">
                <a href="{% url 'pages:home' %}">Home</a>
                <a href="{% url 'menu:home' %}">Menu</a>
                <a href="{% url 'pages:about' %}">About</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-hero">
            <div class="container">
                <h1>{% block page_h1 %}{% endblock page_h1 %}</h1>
                <p>{% block page_subtitle %}{% endblock page_subtitle %}</p>
            </div>
        </section>

        <section class="content">
            <div class="container">
                {% block content %}
                {% endblock content %}
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Cafe Deng &middot; Built with Django</p>
        </div>
    </footer>
</body>
</html>
